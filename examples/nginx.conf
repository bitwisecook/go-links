# Nginx reverse proxy configuration for go-links
#
# This config handles TLS termination and proxies to the Go Links server.
# Supports both "go" (short hostname) and "go.example.com" (FQDN).
#
# Usage:
#   1. Replace go.example.com with your actual domain
#   2. Update SSL certificate paths
#   3. Update the upstream address if go-links is on a different host/port
#   4. Reload nginx: sudo nginx -t && sudo systemctl reload nginx
#
# DNS Setup:
#   - Point "go" (short name) to this nginx server's IP in your local DNS
#   - Point "go.example.com" to this nginx server's IP
#   - For "go" to work in browsers, add it to your DNS search domain

upstream golinks {
    server 127.0.0.1:8080;
    keepalive 8;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name go go.example.com;

    # ACME challenge for Let's Encrypt (if using certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name go go.example.com;

    # TLS certificates - update these paths
    ssl_certificate     /etc/ssl/certs/go.example.com.pem;
    ssl_certificate_key /etc/ssl/private/go.example.com.key;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS (optional, uncomment if you want browsers to always use HTTPS)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Proxy to go-links
    location / {
        proxy_pass http://golinks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Cache static assets
    location /static/ {
        proxy_pass http://golinks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Cache static files for 1 day
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # OpenSearch XML - cache briefly
    location = /opensearch.xml {
        proxy_pass http://golinks;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        expires 1h;
    }
}
