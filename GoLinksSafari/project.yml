name: GoLinks
options:
  bundleIdPrefix: com.bragi0
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # ============================ iOS (iPhone + iPad) ============================
  GoLinks:
    type: application
    platform: iOS
    sources: &appSources
      - path: App/GoLinksApp.swift
      - path: App/ContentView.swift
      - path: App/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: GoLinks
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.golinks
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "QVUFB5676H"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "GoLinks AppStore"
    dependencies:
      - target: GoLinks Extension
        embed: true

  GoLinks Extension:
    type: app-extension
    platform: iOS
    sources: &extSources
      - path: Extension/SafariWebExtensionHandler.swift
      - path: Extension/Resources/manifest.json
        buildPhase: resources
      - path: Extension/Resources/background.js
        buildPhase: resources
      - path: Extension/Resources/popup.html
        buildPhase: resources
      - path: Extension/Resources/popup.css
        buildPhase: resources
      - path: Extension/Resources/popup.js
        buildPhase: resources
      - path: Extension/Resources/options.html
        buildPhase: resources
      - path: Extension/Resources/options.css
        buildPhase: resources
      - path: Extension/Resources/options.js
        buildPhase: resources
      - path: Extension/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: GoLinks Extension
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.golinks.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "QVUFB5676H"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "GoLinks Ext AppStore"

  # ================================ macOS (native) ============================
  GoLinks-mac:
    type: application
    platform: macOS
    sources: *appSources
    settings:
      base:
        PRODUCT_NAME: GoLinks
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.golinks
        INFOPLIST_FILE: App/Info-mac.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: App/GoLinksMac.entitlements
        DEVELOPMENT_TEAM: "QVUFB5676H"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "GoLinks Mac AppStore"
    dependencies:
      - target: GoLinks-mac Extension
        embed: true

  GoLinks-mac Extension:
    type: app-extension
    platform: macOS
    sources: *extSources
    settings:
      base:
        PRODUCT_NAME: GoLinks Extension
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.golinks.Extension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Extension/GoLinksMacExtension.entitlements
        DEVELOPMENT_TEAM: "QVUFB5676H"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "GoLinks Mac Ext AppStore"
